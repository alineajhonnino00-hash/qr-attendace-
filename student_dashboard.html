
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            text-align: center;
            padding: 25px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 12px;
        }
        .qr {
            width: 250px;
            max-width: 100%;
            height: auto;
        }
        a {
            color: #1d3557;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Dashboard</h1>
        <h2>{{ student["full_name"] }}</h2>
        <p>Student ID: {{ student["student_id"] }}</p>

        <h3>Your Personal QR Code</h3>
        <img
            class="qr"
            src="{{ url_for('student_qr', user_id=session['user_id']) }}"
            alt="Your personal QR code"
        >

        <p>Show this QR code to the attendance scanner.</p>
        <p>
            <a href="{{ url_for('student_qr', user_id=session['user_id']) }}"
               download="my-student-qr.png">Download My QR Code</a>
        </p>

        <p><a href="/logout">Log Out</a></p>
    </div> 
</body>
</html>
