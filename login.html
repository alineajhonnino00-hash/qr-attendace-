
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student QR Attendance - Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #eef2ff;
        }

        .login-box {
            background: white;
            width: 90%;
            max-width: 380px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px #0002;
        }

        h2 {
            text-align: center;
            color: #243b80;
        }

        p {
            text-align: center;
            color: #666;
        }

        input, button, select {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            border-radius: 7px;
            font-size: 15px;
        }

        input, select {
            border: 1px solid #ccc;
        }

        button {
            background: #243b80;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #17285b;
        }

        .message {
            color: #c62828;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Student QR Attendance</h2>
        <p>Log in to your account</p>

        {% if error %}
            <div class="message">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" name="username"
                   placeholder="Username" required>

            <input type="password" name="password"
                   placeholder="Password" required>

            <select name="role" required>
                <option value="">Select account type</option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit">Log In</button>
        </form>
    </div>
</body>
</html>
